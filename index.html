<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Audio Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0a0a0a',
                            800: '#1a1a1a',
                            700: '#2a2a2a',
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .glass-border {
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .glow {
                box-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
            }
            
            /* Range input styling */
            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                height: 16px;
                width: 16px;
                border-radius: 50%;
                background: #60a5fa;
                cursor: pointer;
                margin-top: -4px;
            }
            
            input[type="range"]::-moz-range-thumb {
                height: 16px;
                width: 16px;
                border-radius: 50%;
                background: #60a5fa;
                cursor: pointer;
                border: none;
            }
            
            input[type="range"]::-webkit-slider-thumb:hover {
                background: #3b82f6;
            }
            
            /* Scrollbar styling */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            
            ::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.05);
                border-radius: 4px;
            }
            
            ::-webkit-scrollbar-thumb {
                background: rgba(96, 165, 250, 0.5);
                border-radius: 4px;
            }
            
            ::-webkit-scrollbar-thumb:hover {
                background: rgba(96, 165, 250, 0.7);
            }
			
			.scroll-container {
			  max-height: 650px;
			  overflow-y: auto;
			}
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-2">
                Audio Visualizer
            </h1>
            <p class="text-gray-400">Experience sound in real-time with beautiful visualizations</p>
        </header>
        
        <div class="relative w-full h-[700px] rounded-2xl overflow-hidden glass-border">
            <canvas id="visualizer" class="w-full h-full"></canvas>
            
            <!-- Overlay Controls -->
            <div class="flex flex-col absolute top-4 right-4 glass rounded-xl shadow-lg overflow-hidden w-60 scroll-container">
                <div class="bg-gray-800/80 backdrop-blur px-3 py-2 flex items-center justify-between border-b border-gray-700">
                    <h2 class="text-sm font-semibold text-white">Settings</h2>
                    <button id="toggleSettings" class="p-1 rounded hover:bg-white/10 transition-colors">
                        <svg id="collapseIcon" class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                        </svg>
                        <svg id="expandIcon" class="w-4 h-4 text-gray-300 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
                        </svg>
                    </button>
                </div>
                <div class="p-4 max-h-[600px] overflow-auto" id="settingsContainer">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Visualization Mode</label>
                    <select id="modeSelector" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="waveform">Waveform</option>
                        <option value="spectrum">Spectrum</option>
                        <option value="particle">Particle</option>
                    </select>
                </div>
                
                <!-- Waveform Settings -->
                <div id="waveformSettings" class="hidden mb-4 space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Wave Color</label>
                        <div class="flex items-center space-x-2">
                            <input type="color" id="waveColor" value="#60a5fa" class="h-8 w-8 rounded cursor-pointer border border-gray-600 bg-gray-800">
                            <span class="text-xs text-gray-300" id="waveColorHex">#60a5fa</span>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Line Width: <span id="lineWidthValue">2</span>px
                        </label>
                        <input type="range" id="lineWidth" min="1" max="10" value="2" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Glow Intensity: <span id="glowValue">10</span>
                        </label>
                        <input type="range" id="glowIntensity" min="0" max="30" value="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Scale: <span id="scaleValue">1.0</span>x
                        </label>
                        <input type="range" id="waveScale" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Audio Source</label>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm">System</span>
                        <button id="sourceToggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-blue-500 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-6"></span>
                        </button>
                        <span class="text-sm">Mic</span>
                    </div>
                </div>
                
                <!-- Spectrum Settings -->
                <div id="spectrumSettings" class="hidden mb-4 space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Bar Color 1</label>
                        <div class="flex items-center space-x-2">
                            <input type="color" id="spectrumColor1" value="#60a5fa" class="h-8 w-8 rounded cursor-pointer border border-gray-600 bg-gray-800">
                            <span class="text-xs text-gray-300" id="spectrumColor1Hex">#60a5fa</span>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Bar Color 2</label>
                        <div class="flex items-center space-x-2">
                            <input type="color" id="spectrumColor2" value="#8b5cf6" class="h-8 w-8 rounded cursor-pointer border border-gray-600 bg-gray-800">
                            <span class="text-xs text-gray-300" id="spectrumColor2Hex">#8b5cf6</span>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Glow Intensity: <span id="spectrumGlowValue">10</span>
                        </label>
                        <input type="range" id="spectrumGlow" min="0" max="30" value="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Bar Width Multiplier: <span id="widthValue">2.7</span>x
                        </label>
                        <input type="range" id="spectrumWidth" min="1" max="5" step="0.1" value="2.7" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Gap Between Bars: <span id="gapValue">1</span>px
                        </label>
                        <input type="range" id="spectrumGap" min="0" max="5" value="1" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Fill Opacity: <span id="opacityValue">1.0</span>
                        </label>
                        <input type="range" id="spectrumOpacity" min="0.1" max="1.0" step="0.1" value="1.0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
                
                <!-- Particle Settings -->
                <div id="particleSettings" class="hidden mb-4 space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Sphere Color</label>
                        <div class="flex items-center space-x-2">
                            <input type="color" id="particleColor" value="#c2d3ff" class="h-8 w-8 rounded cursor-pointer border border-gray-600 bg-gray-800">
                            <span class="text-xs text-gray-300" id="particleColorHex">#c2d3ff</span>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Sphere Radius: <span id="radiusValue">100</span>px
                        </label>
                        <input type="range" id="particleRadius" min="50" max="200" value="100" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Rotation Speed: <span id="rotationValue">1.0</span>x
                        </label>
                        <input type="range" id="particleRotation" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Pulse Intensity: <span id="pulseValue">1.0</span>x
                        </label>
                        <input type="range" id="particlePulse" min="0" max="2.0" step="0.1" value="1.0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Dot Density: <span id="dotCountValue">14</span> rings
                        </label>
                        <input type="range" id="particleDensity" min="8" max="24" value="14" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Wireframe Opacity: <span id="wireframeOpacityValue">0.5</span>
                        </label>
                        <input type="range" id="particleWireframeOpacity" min="0.1" max="1.0" step="0.1" value="0.5" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">
                            Wave Amplitude: <span id="waveAmplitudeValue">1.0</span>x
                        </label>
                        <input type="range" id="particleWave" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
                </div>
                
                <div class="flex items-center justify-between p-3 bg-gray-800/80 backdrop-blur border-t border-gray-700">
                    <button id="startButton" class="px-4 py-2 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg font-medium hover:opacity-90 transition-all transform hover:scale-105">
                        Start Listening
                    </button>
                    <div id="statusIndicator" class="w-3 h-3 rounded-full bg-red-500"></div>
                </div>
            </div>
        </div>
        
        <div class="mt-8 text-center text-gray-400">
            <p>Click "Start Listening" to begin visualizing audio</p>
        </div>
    </div>

    <script>
        // Main Visualizer Class
        class Visualizer {
            constructor() {
                // Check browser compatibility
                this.checkBrowserCompatibility();
                
                // Canvas setup
                this.canvas = document.getElementById('visualizer');
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();
                
                // Audio context and analyser
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.mediaStream = null;
                this.systemAudioSource = null;
                
                // Visualization settings
                this.mode = 'waveform';
                this.animationId = null;
                this.isSystemAudio = false; // Default to microphone
                
                // Waveform customization settings
                this.waveformSettings = {
                    color: '#60a5fa',
                    lineWidth: 2,
                    glowIntensity: 10,
                    scale: 1.0
                };
                
                // Spectrum customization settings
                this.spectrumSettings = {
                    color1: '#60a5fa',
                    color2: '#8b5cf6',
                    glowIntensity: 10,
                    widthMultiplier: 2.7,
                    gap: 1,
                    opacity: 1.0
                };
                
                // Particle customization settings
                this.particleSettings = {
                    color: '#c2d3ff',
                    radius: 100,
                    rotationSpeed: 1.0,
                    pulseIntensity: 1.0,
                    phiCount: 14,
                    wireframeOpacity: 0.5,
                    waveAmplitude: 1.0
                };
                
                // Audio data buffers
                this.dataArray = null;
                this.timeData = null;
                this.bufferLength = 0;
                
                // Event listeners
                this.setupEventListeners();
                
                // Handle window resize
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            // Check browser compatibility
            checkBrowserCompatibility() {
                const compatibilityMessage = document.querySelector('.browser-compatibility-message');
                
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    console.warn("Audio API not supported in this browser");
                    if (compatibilityMessage) {
                        compatibilityMessage.textContent = "Warning: Audio API not supported in this browser";
                    }
                }
                
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    console.warn("getDisplayMedia not supported - system audio capture unavailable");
                    // This is expected for many browsers
                }
            }
            
            // Resize canvas to fit container
            resizeCanvas() {
                this.canvas.width = this.canvas.clientWidth;
                this.canvas.height = this.canvas.clientHeight;
            }
            
            // Setup event listeners
            setupEventListeners() {
                document.getElementById('toggleSettings').addEventListener('click', () => this.toggleSettingsCollapse());
                document.getElementById('startButton').addEventListener('click', () => this.toggleAudio());
                document.getElementById('modeSelector').addEventListener('change', (e) => {
                    this.mode = e.target.value;
                    this.updateSettingsVisibility();
                });
                document.getElementById('sourceToggle').addEventListener('click', () => this.toggleAudioSource());
                
                // Waveform settings controls
                document.getElementById('waveColor').addEventListener('input', (e) => {
                    this.waveformSettings.color = e.target.value;
                    document.getElementById('waveColorHex').textContent = e.target.value;
                });
                
                document.getElementById('lineWidth').addEventListener('input', (e) => {
                    this.waveformSettings.lineWidth = parseInt(e.target.value);
                    document.getElementById('lineWidthValue').textContent = this.waveformSettings.lineWidth;
                });
                
                document.getElementById('glowIntensity').addEventListener('input', (e) => {
                    this.waveformSettings.glowIntensity = parseInt(e.target.value);
                    document.getElementById('glowValue').textContent = this.waveformSettings.glowIntensity;
                });
                
                document.getElementById('waveScale').addEventListener('input', (e) => {
                    this.waveformSettings.scale = parseFloat(e.target.value);
                    document.getElementById('scaleValue').textContent = e.target.value;
                });
                
                // Spectrum settings controls
                document.getElementById('spectrumColor1').addEventListener('input', (e) => {
                    this.spectrumSettings.color1 = e.target.value;
                    document.getElementById('spectrumColor1Hex').textContent = e.target.value;
                });
                
                document.getElementById('spectrumColor2').addEventListener('input', (e) => {
                    this.spectrumSettings.color2 = e.target.value;
                    document.getElementById('spectrumColor2Hex').textContent = e.target.value;
                });
                
                document.getElementById('spectrumGlow').addEventListener('input', (e) => {
                    this.spectrumSettings.glowIntensity = parseInt(e.target.value);
                    document.getElementById('spectrumGlowValue').textContent = this.spectrumSettings.glowIntensity;
                });
                
                document.getElementById('spectrumWidth').addEventListener('input', (e) => {
                    this.spectrumSettings.widthMultiplier = parseFloat(e.target.value);
                    document.getElementById('widthValue').textContent = e.target.value;
                });
                
                document.getElementById('spectrumGap').addEventListener('input', (e) => {
                    this.spectrumSettings.gap = parseInt(e.target.value);
                    document.getElementById('gapValue').textContent = e.target.value;
                });
                
                document.getElementById('spectrumOpacity').addEventListener('input', (e) => {
                    this.spectrumSettings.opacity = parseFloat(e.target.value);
                    document.getElementById('opacityValue').textContent = e.target.value;
                });
                
                // Particle settings controls
                document.getElementById('particleColor').addEventListener('input', (e) => {
                    this.particleSettings.color = e.target.value;
                    document.getElementById('particleColorHex').textContent = e.target.value;
                });
                
                document.getElementById('particleRadius').addEventListener('input', (e) => {
                    this.particleSettings.radius = parseInt(e.target.value);
                    document.getElementById('radiusValue').textContent = this.particleSettings.radius;
                });
                
                document.getElementById('particleRotation').addEventListener('input', (e) => {
                    this.particleSettings.rotationSpeed = parseFloat(e.target.value);
                    document.getElementById('rotationValue').textContent = this.particleSettings.rotationSpeed;
                });
                
                document.getElementById('particlePulse').addEventListener('input', (e) => {
                    this.particleSettings.pulseIntensity = parseFloat(e.target.value);
                    document.getElementById('pulseValue').textContent = this.particleSettings.pulseIntensity;
                });
                
                document.getElementById('particleDensity').addEventListener('input', (e) => {
                    this.particleSettings.phiCount = parseInt(e.target.value);
                    document.getElementById('dotCountValue').textContent = this.particleSettings.phiCount;
                });
                
                document.getElementById('particleWireframeOpacity').addEventListener('input', (e) => {
                    this.particleSettings.wireframeOpacity = parseFloat(e.target.value);
                    document.getElementById('wireframeOpacityValue').textContent = this.particleSettings.wireframeOpacity;
                });
                
                document.getElementById('particleWave').addEventListener('input', (e) => {
                    this.particleSettings.waveAmplitude = parseFloat(e.target.value);
                    document.getElementById('waveAmplitudeValue').textContent = this.particleSettings.waveAmplitude;
                });
            }
            
            // Toggle settings panel collapse/expand
            toggleSettingsCollapse() {
                const overlayControls = document.getElementById('overlayControls');
                const settingsContainer = document.getElementById('settingsContainer');
                const collapseIcon = document.getElementById('collapseIcon');
                const expandIcon = document.getElementById('expandIcon');
                
                if (settingsContainer.style.display === 'none') {
                    settingsContainer.style.display = 'block';
                    collapseIcon.classList.remove('hidden');
                    expandIcon.classList.add('hidden');
                } else {
                    settingsContainer.style.display = 'none';
                    collapseIcon.classList.add('hidden');
                    expandIcon.classList.remove('hidden');
                }
            }
            
            // Update settings panel visibility based on selected mode
            updateSettingsVisibility() {
                const waveformSettings = document.getElementById('waveformSettings');
                const spectrumSettings = document.getElementById('spectrumSettings');
                const particleSettings = document.getElementById('particleSettings');
                
                if (this.mode === 'waveform') {
                    waveformSettings.classList.remove('hidden');
                    spectrumSettings.classList.add('hidden');
                    particleSettings.classList.add('hidden');
                } else if (this.mode === 'spectrum') {
                    waveformSettings.classList.add('hidden');
                    spectrumSettings.classList.remove('hidden');
                    particleSettings.classList.add('hidden');
                } else {
                    waveformSettings.classList.add('hidden');
                    spectrumSettings.classList.add('hidden');
                    particleSettings.classList.remove('hidden');
                }
            }
            
            // Toggle audio source between microphone and system audio
            toggleAudioSource() {
                this.isSystemAudio = !this.isSystemAudio;
                const toggle = document.getElementById('sourceToggle');
                
                // Update toggle button appearance
                if (this.isSystemAudio) {
                    toggle.classList.add('bg-purple-500');
                    toggle.classList.remove('bg-blue-500');
                    toggle.querySelector('span').classList.remove('translate-x-6');
                    toggle.querySelector('span').classList.add('translate-x-1');
                } else {
                    toggle.classList.add('bg-blue-500');
                    toggle.classList.remove('bg-purple-500');
                    toggle.querySelector('span').classList.remove('translate-x-1');
                    toggle.querySelector('span').classList.add('translate-x-6');
                }
                
                // If audio is currently active, restart with new source
                if (this.audioContext) {
                    this.stopAudio();
                    this.startAudio();
                }
            }
            
            // Toggle audio input
            async toggleAudio() {
                const button = document.getElementById('startButton');
                const indicator = document.getElementById('statusIndicator');
                
                if (this.audioContext) {
                    // Stop audio
                    this.stopAudio();
                    button.textContent = 'Start Listening';
                    indicator.className = 'w-3 h-3 rounded-full bg-red-500';
                } else {
                    // Start audio
                    try {
                        await this.startAudio();
                        button.textContent = 'Stop Listening';
                        indicator.className = 'w-3 h-3 rounded-full bg-green-500';
                    } catch (err) {
                        console.error('Error accessing audio:', err);
                        button.textContent = 'Error - Try Again';
                        indicator.className = 'w-3 h-3 rounded-full bg-red-500';
                        
                        // Show a more user-friendly message
                        alert("Audio access error: " + err.message + "\n\n" +
                               "This might be due to browser restrictions or lack of permissions.\n\n" +
                               "Try using microphone mode instead, or check your browser settings.");
                    }
                }
            }
            
            // Start audio input
            async startAudio() {
                // Create audio context
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 256;
                
                // Get buffer length
                this.bufferLength = this.analyser.frequencyBinCount;
                this.dataArray = new Uint8Array(this.bufferLength);
                this.timeData = new Uint8Array(this.bufferLength);
                
                try {
                    if (this.isSystemAudio) {
                        try {
                            // Try to capture system audio using getDisplayMedia
                            const stream = await navigator.mediaDevices.getDisplayMedia({
                                video: true,
                                audio: true
                            });
                            
                            // Create audio source from the stream
                            this.source = this.audioContext.createMediaStreamSource(stream);
                            console.log("System audio capture successful");
                        } catch (error) {
                            console.warn("System audio capture failed, falling back to microphone:", error);
                            // If system audio fails, fall back to microphone
                            this.isSystemAudio = false;
                            this.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            this.source = this.audioContext.createMediaStreamSource(this.mediaStream);
                        }
                    } else {
                        // Microphone capture (existing code)
                        this.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        this.source = this.audioContext.createMediaStreamSource(this.mediaStream);
                    }
                    
                    this.source.connect(this.analyser);
                    
                    // Start visualization
                    this.animate();
                } catch (err) {
                    console.error('Error creating audio source:', err);
                    throw err;
                }
            }
            
            // Check if system audio is supported
            isSystemAudioSupported() {
                // Check for required APIs
                return !!(navigator.mediaDevices && 
                             navigator.mediaDevices.getDisplayMedia && 
                             navigator.mediaDevices.getUserMedia);
            }
            
            // Stop audio input
            stopAudio() {
                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach(track => track.stop());
                }
                
                if (this.audioContext) {
                    this.audioContext.close();
                }
                
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.mediaStream = null;
                this.systemAudioSource = null;
            }
            
            // Main animation loop
            animate() {
                this.animationId = requestAnimationFrame(() => this.animate());
                
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Get frequency data
                this.analyser.getByteFrequencyData(this.dataArray);
                
                // Draw based on mode
                if (this.mode === 'waveform') {
                    this.drawWaveform();
                } else if (this.mode === 'spectrum') {
                    this.drawSpectrum();
                } else if (this.mode === 'particle') {
                    this.drawParticle();
                }
            }
            
            // Draw waveform visualization with scrolling animation
            drawWaveform() {
                // Get time domain data
                this.analyser.getByteTimeDomainData(this.timeData);
                
                // Get waveform settings
                const settings = this.waveformSettings;
                
                // Clear with fade effect for trail
                this.ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw scrolling waveform
                this.ctx.beginPath();
                this.ctx.lineWidth = settings.lineWidth;
                this.ctx.strokeStyle = settings.color;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                
                const sliceWidth = this.canvas.width / this.timeData.length;
                let x = 0;
                
                for (let i = 0; i < this.timeData.length; i++) {
                    const v = this.timeData[i] / 128.0;
                    // Keep wave centered with audio-reactive amplitude
                    const centerY = this.canvas.height / 2;
                    const amplitude = (this.canvas.height / 2) * settings.scale * 0.8;
                    const y = centerY + (v - 1) * amplitude;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.ctx.stroke();
                
                // Add glow effect
                this.ctx.shadowColor = settings.color;
                this.ctx.shadowBlur = settings.glowIntensity;
                this.ctx.stroke();
                this.ctx.shadowBlur = 0;
            }
            
            // Draw spectrum visualization with customizable bars
            drawSpectrum() {
                // Get spectrum settings
                const settings = this.spectrumSettings;
                
                // Draw bars
                const barWidth = (this.canvas.width / this.bufferLength) * settings.widthMultiplier;
                let barHeight;
                let x = 0;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    // Calculate bar height from audio data (not affected by opacity)
                    barHeight = this.dataArray[i] / 255 * this.canvas.height;
                    
                    // Create gradient
                    const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                    gradient.addColorStop(0, settings.color1);
                    gradient.addColorStop(1, settings.color2);
                    
                    this.ctx.globalAlpha = settings.opacity;
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(x, this.canvas.height - barHeight, barWidth, barHeight);
                    
                    // Add glow effect
                    this.ctx.shadowColor = settings.color1;
                    this.ctx.shadowBlur = settings.glowIntensity;
                    this.ctx.fillRect(x, this.canvas.height - barHeight, barWidth, barHeight);
                    this.ctx.shadowBlur = 0;
                    
                    x += barWidth + settings.gap;
                }
                
                this.ctx.globalAlpha = 1.0;
            }
            
            // Draw particle visualization with audio-reactive 3D wireframe sphere
            drawParticle() {
                // Clear canvas with fade effect for motion blur
                this.ctx.fillStyle = 'rgba(2, 2, 12, 0.15)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Get frequency data for wavey effect
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) {
                    sum += this.dataArray[i];
                }
                const average = sum / this.dataArray.length;
                const intensity = average / 255;
                
                // Get particle settings
                const settings = this.particleSettings;
                
                // Base size for the sphere (medium)
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                let radius = settings.radius;
                radius += intensity * 40; // Subtle pulse
                
                // Apply pulse intensity
                const pulse = Math.sin(Date.now() * 0.005) * intensity * settings.pulseIntensity * 10;
                radius += pulse;
                
                // Generate phi and theta values for sphere with rotation
                const phiCount = settings.phiCount; // Vertical rings
                const thetaCount = 22; // Horizontal dots per ring (fixed)
                const points = [];
                const rotationX = Date.now() * 0.0003 * settings.rotationSpeed; // Continuous rotation on X axis
                const rotationY = Date.now() * 0.0002 * settings.rotationSpeed; // Continuous rotation on Y axis
                
                for (let i = 0; i < phiCount; i++) {
                    for (let j = 0; j < thetaCount; j++) {
                        const phi = Math.acos(-1 + (2 * i) / phiCount);
                        const theta = (2 * Math.PI * j) / thetaCount;
                        
                        // Apply rotation matrices
                        let x = radius * Math.sin(phi) * Math.cos(theta);
                        let y = radius * Math.sin(phi) * Math.sin(theta);
                        let z = radius * Math.cos(phi);
                        
                        // Rotate around Y axis
                        const cosY = Math.cos(rotationY);
                        const sinY = Math.sin(rotationY);
                        let x1 = x * cosY - z * sinY;
                        let z1 = x * sinY + z * cosY;
                        
                        // Rotate around X axis
                        const cosX = Math.cos(rotationX);
                        const sinX = Math.sin(rotationX);
                        let y2 = y * cosX - z1 * sinX;
                        let z2 = y * sinX + z1 * cosX;
                        
                        // Add frequency-based wavey displacement
                        const freqIndex = Math.floor((j / thetaCount) * this.bufferLength);
                        const freqValue = this.dataArray[freqIndex] / 128;
                        const waveAmount = Math.sin(Date.now() * 0.002 + i * 0.5 + j * 0.3) * freqValue * settings.waveAmplitude;
                        
                        x1 += waveAmount;
                        y2 += waveAmount * 0.5;
                        
                        points.push({x: x1, y: y2, z: z2});
                    }
                }
                
                // Sort points by z-depth (back to front) for proper depth ordering
                points.sort((a, b) => b.z - a.z);
                
                // Draw connecting lines (wireframe)
                this.ctx.strokeStyle = `rgba(180, 200, 255, ${settings.wireframeOpacity * (0.1 + intensity * 0.3)})`;
                this.ctx.lineWidth = 1;
                
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    
                    // Only draw if points are close in 3D space
                    const distance = Math.sqrt(
                        Math.pow(p1.x - p2.x, 2) +
                        Math.pow(p1.y - p2.y, 2) +
                        Math.pow(p1.z - p2.z, 2)
                    );
                    
                    if (distance < radius * 0.3) {
                        // Add slight pulsing effect
                        const pulse = Math.sin(Date.now() * 0.005) * intensity * 3;
                        const x1 = centerX + p1.x + pulse;
                        const y1 = centerY + p1.y;
                        const x2 = centerX + p2.x + pulse;
                        const y2 = centerY + p2.y;
                        
                        this.ctx.beginPath();
                        this.ctx.moveTo(x1, y1);
                        this.ctx.lineTo(x2, y2);
                        this.ctx.stroke();
                    }
                }
                
                // Draw dots at vertices
                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    
                    // Add wavey displacement based on local frequency
                    const freqIndex = Math.floor((i / points.length) * this.bufferLength);
                    const freqValue = this.dataArray[freqIndex] / 128;
                    const wave = Math.sin(Date.now() * 0.003 + i * 0.123) * freqValue * 8;
                    
                    const x = centerX + p.x + wave;
                    const y = centerY + p.y + wave * 0.3;
                    const size = 2 + intensity * 1.5;
                    
                    // Glowing monochrome effect - brightness varies with frequency
                    const baseAlpha = 0.25;
                    const freqAlpha = 0.4 + (freqValue / 255) * 0.5;
                    const alpha = baseAlpha + freqAlpha;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(190, 210, 255, ${alpha})`;
                    this.ctx.fill();
                    
                    // Add glow for brighter dots
                    if (freqValue > 80) {
                        this.ctx.shadowColor = 'rgba(190, 210, 255, 0.95)';
                        this.ctx.shadowBlur = 12 + (freqValue / 128) * 15;
                        this.ctx.shadowBlur = 0;
                    }
                }
            }
        }
        
        // Initialize visualizer when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const visualizer = new Visualizer();
            
            // Initialize waveform settings controls
            const waveColor = document.getElementById('waveColor');

            const lineWidth = document.getElementById('lineWidth');

            document.getElementById('lineWidthValue').textContent = visualizer.waveformSettings.lineWidth;
            
            const glowIntensity = document.getElementById('glowIntensity');
            glowIntensity.value = visualizer.waveformSettings.glowIntensity;
            document.getElementById('glowValue').textContent = visualizer.waveformSettings.glowIntensity;
            
            const waveScale = document.getElementById('waveScale');
            waveScale.value = visualizer.waveformSettings.scale;
            document.getElementById('scaleValue').textContent = visualizer.waveformSettings.scale;
            
            // Initialize spectrum settings controls
            const spectrumColor1 = document.getElementById('spectrumColor1');
            spectrumColor1.value = visualizer.spectrumSettings.color1;
            document.getElementById('spectrumColor1Hex').textContent = visualizer.spectrumSettings.color1;
            
            const spectrumColor2 = document.getElementById('spectrumColor2');
            spectrumColor2.value = visualizer.spectrumSettings.color2;
            document.getElementById('spectrumColor2Hex').textContent = visualizer.spectrumSettings.color2;
            
            const spectrumGlow = document.getElementById('spectrumGlow');
            spectrumGlow.value = visualizer.spectrumSettings.glowIntensity;
            document.getElementById('spectrumGlowValue').textContent = visualizer.spectrumSettings.glowIntensity;
            
            const spectrumWidth = document.getElementById('spectrumWidth');
            spectrumWidth.value = visualizer.spectrumSettings.widthMultiplier;
            document.getElementById('widthValue').textContent = visualizer.spectrumSettings.widthMultiplier;
            
            const spectrumGap = document.getElementById('spectrumGap');
            spectrumGap.value = visualizer.spectrumSettings.gap;
            document.getElementById('gapValue').textContent = visualizer.spectrumSettings.gap;
            
            const spectrumOpacity = document.getElementById('spectrumOpacity');
            spectrumOpacity.value = visualizer.spectrumSettings.opacity;
            document.getElementById('opacityValue').textContent = visualizer.spectrumSettings.opacity;
            
            // Initialize particle settings controls
            const particleColor = document.getElementById('particleColor');
            particleColor.value = visualizer.particleSettings.color;
            document.getElementById('particleColorHex').textContent = visualizer.particleSettings.color;
            
            const particleRadius = document.getElementById('particleRadius');
            particleRadius.value = visualizer.particleSettings.radius;
            document.getElementById('radiusValue').textContent = visualizer.particleSettings.radius;
            
            const particleRotation = document.getElementById('particleRotation');
            particleRotation.value = visualizer.particleSettings.rotationSpeed;
            document.getElementById('rotationValue').textContent = visualizer.particleSettings.rotationSpeed;
            
            const particlePulse = document.getElementById('particlePulse');
            particlePulse.value = visualizer.particleSettings.pulseIntensity;
            document.getElementById('pulseValue').textContent = visualizer.particleSettings.pulseIntensity;
            
            const particleDensity = document.getElementById('particleDensity');
            particleDensity.value = visualizer.particleSettings.phiCount;
            document.getElementById('dotCountValue').textContent = visualizer.particleSettings.phiCount;
            
            const particleWireframeOpacity = document.getElementById('particleWireframeOpacity');
            particleWireframeOpacity.value = visualizer.particleSettings.wireframeOpacity;
            document.getElementById('wireframeOpacityValue').textContent = visualizer.particleSettings.wireframeOpacity;
            
            const particleWave = document.getElementById('particleWave');
            particleWave.value = visualizer.particleSettings.waveAmplitude;
            document.getElementById('waveAmplitudeValue').textContent = visualizer.particleSettings.waveAmplitude;
            
            // Show waveform settings initially
            visualizer.updateSettingsVisibility();
        });
    </script>
